# See modules/naboj/editor.yaml for what this file is.

label: Scholar

# Two levels are editable here, and they are different things: a handout or homework sheet has
# its own `text.md`, and holds a directory per problem. One standalone document serves both --
# `modules/scholar/builder/standalone.py` picks the parts from the depth of the path.
# The level the audit page aggregates at.
scope: year

units:
  - glob: '*/*/handouts/*'
    levels: [course, year, kind, issue]
    targets: [text]
    render: 'render/scholar/{unit}/{target}.md'
    preview: 'output/scholar/{unit}/standalone.pdf'

  - glob: '*/*/handouts/*/*'
    levels: [course, year, kind, issue, problem]
    targets: [problem, solution]
    render: 'render/scholar/{unit}/{target}.md'
    preview: 'output/scholar/{unit}/standalone.pdf'

  - glob: '*/*/homework/*'
    levels: [course, year, kind, issue]
    targets: [text]
    render: 'render/scholar/{unit}/{target}.md'
    preview: 'output/scholar/{unit}/standalone.pdf'

  - glob: '*/*/homework/*/*'
    levels: [course, year, kind, issue, problem]
    targets: [problem, solution]
    render: 'render/scholar/{unit}/{target}.md'
    preview: 'output/scholar/{unit}/standalone.pdf'

# Where this module's content comes from. `source/` is gitignored and holds no gitlinks -- these
# are independent repositories, cloned in by hand -- so this list is the only record of what to
# clone, and the editor shows it when it finds nothing to edit.
sources:
  - path: source/scholar/STA
    url: git@github.com:sesquideus/teaching-STA
  - path: source/scholar/TA1
    url: git@github.com:sesquideus/TA1
  - path: source/scholar/TA2
    url: git@github.com:sesquideus/TA2
