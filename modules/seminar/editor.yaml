# See modules/naboj/editor.yaml for what this file is.

label: Seminar

# The audit page covers this module too. Most checks are Náboj's and say so with `modules=`, so
# what seminar actually gets is the module-agnostic set -- `unit-unknown` among them, which is why
# this was turned on: `FKS/32/2/3/05` writes `\SI{10}{\m}`, and nothing could see it before.
audit: true

# The level the audit page aggregates at.
scope: volume

units:
  # <competition>/<volume>/<semester>/<round>/<problem>, e.g. FKS/41/1/3/07
  - glob: '*/*/*/*/*'
    levels: [competition, volume, semester, round, problem]
    targets: [problem, solution]
    render: 'render/seminar/{unit}/{target}.md'
    preview: 'output/seminar/{unit}/standalone.pdf'

# Where this module's content comes from. `source/` is gitignored and holds no gitlinks -- these
# are independent repositories, cloned in by hand -- so this list is the only record of what to
# clone, and the editor shows it when it finds nothing to edit.
sources:
  - path: source/seminar/FKS
    url: git@github.com:TrojstenSK/fks
  - path: source/seminar/FX
    url: git@github.com:TrojstenSK/FX-problems
  - path: source/seminar/test
    url: git@github.com:TrojstenSK/dgs-seminar-testing
