full: 'german'
native: 'deutsch'
locale: 'de-AT'
quotes:
  open: '„'
  close: '“'
# See `core/filters/spacing.lua`. German has no one-letter-word rule; what it has is the thin
# space between the halves of an abbreviation, which authors used to type as `\thinspace`.
typography:
  thin_pairs: ['d. h.', 'z. B.', 'u. a.', 'u. U.', 'v. a.', 'z. T.']

cref:
  figure:
    singular: 'Abbildung'
    plural: 'Abbildungen'
  table:
    singular: 'Tabelle'
    plural: 'Tabellen'
  equation:
    singular: 'Gleichung'
    plural: 'Gleichungen'
  section:
    singular: 'Aufgabe'
    plural: 'Aufgaben'
siunitx:
  output_decimal_marker: ','
  list_pair_separator: 'und'
  list_final_separator: 'und'
  units:
    horsepower: 'PS'

# Words inside maths. These are what the sources already use, or elementary
# enough not to be a judgement call; anything absent falls back to English.
words:
  and: 'und'
  or: 'oder'
