full: 'portuguese'
native: 'português'
locale: 'pt-PT'
quotes:
  open: '“'
  close: '”'
  extra: 'portuguese'
cref:
  figure:
    singular: 'figura'
    plural: 'figuras'
  table:
    singular: 'tabela'
    plural: 'tabelas'
  equation:
    singular: 'equação'
    plural: 'equações'
  section:
    singular: 'problema'
    plural: 'problemas'
  listing:
    singular: 'listagem'
    plural: 'listagens'
siunitx:
  output_decimal_marker: ','
  list_pair_separator: 'e'
  list_final_separator: 'e'

# Words inside maths. These are what the sources already use, or elementary
# enough not to be a judgement call; anything absent falls back to English.
words:
  and: 'e'
  or: 'ou'
