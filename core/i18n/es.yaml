full: 'spanish'
native: 'español'
locale: 'es-ES'
quotes:
  open: '«'
  close: '»'
cref:
  figure:
    singular: 'figura'
    plural: 'figuras'
  table:
    singular: 'tabla'
    plural: 'tables'
  equation:
    singular: 'ecuación'
    plural: 'ecuacións'
  section:
    singular: 'problema'
    plural: 'problemas'
siunitx:
  output_decimal_marker: ','
  list_pair_separator: 'y'
  list_final_separator: 'y'

# Words inside maths. These are what the sources already use, or elementary
# enough not to be a judgement call; anything absent falls back to English.
words:
  and: 'y'
  or: 'o'
