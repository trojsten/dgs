full: 'slovak'
native: 'slovensky'
locale: 'sk-SK'
quotes:
  open: '„'
  close: '“'
# Spacing the build inserts for this language: `singles` are the one-letter words that must not
# end a line (STN 01 6910), `nbsp_pairs` and `thin_pairs` the abbreviations whose halves belong
# together. Both cases of a single are derived, so list it once. See `core/filters/spacing.lua`.
typography:
  singles: ['a', 'i', 'k', 'o', 's', 'u', 'v', 'z']
  nbsp_pairs: ['t. j.', 't. z.']

cref:
  figure:
    singular: 'obrázok'
    plural: 'obrázky'
  table:
    singular: 'tabuľka'
    plural: 'tabuľky'
  equation:
    singular: 'rovnica'
    plural: 'rovnice'
  section:
    singular: 'úloha'
    plural: 'úlohy'
siunitx:
  output_decimal_marker: ','
  list_pair_separator: 'a'
  list_final_separator: 'a'

# Words inside maths. These are what the sources already use, or elementary
# enough not to be a judgement call; anything absent falls back to English.
words:
  and: 'a'
  or: 'alebo'
  wherefrom: 'odkiaľ'
