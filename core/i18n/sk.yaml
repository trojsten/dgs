quotes:
  open: '„'
  close: '“'
cref:
  figure:
    singular: 'obrázok'
    plural: 'obrázky'
  table:
    singular: 'tabuľka'
    plural: 'tabuľky'
  equation:
    singular: 'rovnica'
    plural: 'rovnice'
