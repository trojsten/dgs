full: 'english'
native: 'English'
locale: 'en-US'
quotes:
  open: '“'
  close: '”'
cref:
  figure:
    singular: 'figure'
    plural: 'figures'
  table:
    singular: 'table'
    plural: 'tables'
  equation:
    singular: 'equation'
    plural: 'equations'
  section:
    singular: 'problem'
    plural: 'problems'
  listing:
    singular: 'listing'
    plural: 'listings'
siunitx:
  output_decimal_marker: '.'
  list_pair_separator: 'and'
  list_final_separator: 'and'

# Words inside maths. English defines all of them; other languages define what they use, and asking
# for one a language has not defined is an error rather than a silent fall back to this file.
words:
  and: 'and'
  or: 'or'
  therefore: 'therefore'
  wherefrom: 'wherefrom'
