full: 'czech'
native: 'česky'
locale: 'cs-CZ'
quotes:
  open: '„'
  close: '“'
# See `core/filters/spacing.lua`. ČSN 01 6910, as the Institute of the Czech Language states it
# (https://prirucka.ujc.cas.cz/?id=880): a line may not break "ve spojení neslabičných předložek
# k, s, v, z s následujícím slovem" nor "ve spojení slabičných předložek o, u a spojek a, i".
#
# That is the whole list -- **the vocalised forms `ve`, `ze`, `ke`, `se` are not covered**, and
# neither are the other two-letter prepositions `na`, `do`, `po`, `za`. The sources write 18 `ve\ `
# and 6 `ze\ ` by hand; those are an author's preference, not the norm, so they stay by hand.
latex:
  # Low enough that a hyphenated word may actually break at its hyphen, which is what
  # `typography.repeat_hyphen` below is for. Forbidding the break (10000) was the other way to
  # get correct output, and it throws away a breakpoint the norm does not forbid. 50 is TeX's
  # own default: a mild discouragement, not a ban.
  #
  # Independent of \hyphenpenalty, which governs ordinary hyphenation and which `dgs.cls` sets
  # separately: `\rephyphen`'s discretionary carries an empty pre-break list precisely so that
  # only this parameter decides it.
  exhyphenpenalty: 50
typography:
  singles: ['a', 'i', 'k', 'o', 's', 'u', 'v', 'z']
  nbsp_pairs: ['t. j.']
  # A word breaking at its hyphen repeats it on the next line -- `česko-` then `-slovenský`.
  # ČSN 01 6910 states it for the spojovník. `core/filters/hyphens.lua` emits `\rephyphen`,
  # which `core/latex/hacks.tex` defines; `latex.exhyphenpenalty` above is what lets the break
  # happen at all.
  repeat_hyphen: true

cref:
  figure:
    singular: 'obrázek'
    plural: 'obrázky'
  table:
    singular: 'tabulka'
    plural: 'tabulky'
  equation:
    singular: 'rovnice'
    plural: 'rovnice'
  section:
    singular: 'problém'
    plural: 'problémy'
siunitx:
  output_decimal_marker: ','
  list_pair_separator: 'a'
  list_final_separator: 'a'

# Words inside maths. These are what the sources already use, or elementary
# enough not to be a judgement call. **Nothing falls back to English**: a word this file has not
# got is boxed in red where it was asked for, collected, and the render then fails. Add the word
# here rather than leaving the box -- a fallback for prose is how a Slovak booklet comes to print
# `therefore`, which looks right until it is in print.
words:
  and: 'a'
  const: 'konst.'
  or: 'nebo'
