full: 'czech'
native: 'česky'
locale: 'cs-CZ'
quotes:
  open: '„'
  close: '“'
# See `core/filters/spacing.lua`. One-letter words must not end a line (ČSN 01 6910).
typography:
  singles: ['a', 'i', 'k', 'o', 's', 'u', 'v', 'z']
  nbsp_pairs: ['t. j.']

cref:
  figure:
    singular: 'obrázek'
    plural: 'obrázky'
  table:
    singular: 'tabulka'
    plural: 'tabulky'
  equation:
    singular: 'rovnice'
    plural: 'rovnice'
  section:
    singular: 'problém'
    plural: 'problémy'
siunitx:
  output_decimal_marker: ','
  list_pair_separator: 'a'
  list_final_separator: 'a'

# Words inside maths. These are what the sources already use, or elementary
# enough not to be a judgement call; anything absent falls back to English.
words:
  and: 'a'
  const: 'konst.'
  or: 'nebo'
