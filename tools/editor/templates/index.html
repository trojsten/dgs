<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Náboj problem editor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <select id="comp-select"></select>
    <select id="vol-select"></select>
    <select id="pid-select"></select>
    <select id="lang-select"></select>
    <button id="save-btn">Save (Ctrl/Cmd+S)</button>
    <button id="compile-btn">Compile (Ctrl/Cmd+Enter)</button>
    <button id="render-btn">Render</button>
    <label id="autocompile-label" title="Recompile a short while after you stop typing">
      <input type="checkbox" id="autocompile"> auto
    </label>
    <span id="status"></span>
  </header>

  <main id="grid">
    <section id="pane-source" class="pane">
      <div class="tabbar" id="source-tabs"></div>
      <div class="code-editor">
        <pre class="code-highlight" aria-hidden="true"><code id="source-highlight"></code></pre>
        <textarea id="source-editor" class="code-input" spellcheck="false"></textarea>
      </div>
    </section>

    <div id="col-resizer" role="separator" aria-orientation="vertical" aria-label="Resize source/output columns"></div>

    <section id="pane-output" class="pane">
      <div class="tabbar">
        <button class="tab active" data-output="pdf">PDF</button>
        <button class="tab" data-output="rendered">Rendered Markdown</button>
        <button class="tab" data-output="lint">Lint (advisory)</button>
        <button class="tab" data-output="log">Log</button>
        <a id="pdf-newtab" class="tab-link" href="#" target="_blank" rel="noopener">open in tab &#8599;</a>
      </div>
      <div id="output-pdf" class="output-frame">
        <iframe id="pdf-frame" title="Compiled problem"></iframe>
        <div id="pdf-placeholder" class="placeholder">Nothing compiled yet &mdash; press Ctrl/Cmd+Enter.</div>
      </div>
      <pre id="output-rendered" class="output" hidden><code id="output-rendered-code"></code></pre>
      <div id="output-lint" class="output" hidden></div>
      <pre id="output-log" class="output" hidden><code id="output-log-code"></code></pre>
    </section>

    <div id="row-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize meta.yaml panel"></div>

    <section id="pane-context" class="pane">
      <div class="pane-label">meta.yaml</div>
      <div class="code-editor">
        <pre class="code-highlight" aria-hidden="true"><code id="meta-highlight"></code></pre>
        <textarea id="meta-editor" class="code-input" spellcheck="false"></textarea>
      </div>
    </section>
  </main>

  <script src="/static/highlight.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
