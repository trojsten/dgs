<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Náboj problem editor</title>
  <link rel="stylesheet" href="/static/style.css?v={{ assets }}">
</head>
<body>
  <header id="topbar">
    <select id="module-select"></select>
    <!-- One select per path level, generated from the module's unit list: units are four
         segments deep in Naboj, five in seminar, and both in scholar. -->
    <span id="unit-cascade"></span>
    <select id="lang-select" hidden></select>
    <button id="save-btn">Save (Ctrl/Cmd+S)</button>
    <button id="compile-btn">Compile (Ctrl/Cmd+Enter)</button>
    <button id="render-btn">Render</button>
    <label id="autocompile-label" title="Recompile a short while after you stop typing">
      <input type="checkbox" id="autocompile"> auto
    </label>
    <span id="status"></span>
  </header>

  <main id="grid">
    <section id="pane-source" class="pane">
      <div class="tabbar" id="source-tabs"></div>
      <div class="code-editor">
        <pre class="code-highlight" aria-hidden="true"><code id="source-highlight"></code></pre>
        <textarea id="source-editor" class="code-input" spellcheck="false"></textarea>
      </div>
    </section>

    <div id="row-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize meta.yaml panel"></div>

    <section id="pane-context" class="pane">
      <div class="pane-label" id="meta-label">meta.yaml</div>
      <div class="code-editor">
        <pre class="code-highlight" aria-hidden="true"><code id="meta-highlight"></code></pre>
        <textarea id="meta-editor" class="code-input" spellcheck="false"></textarea>
      </div>
    </section>

    <div id="col-resizer" role="separator" aria-orientation="vertical" aria-label="Resize source/output columns"></div>

    <section id="pane-output" class="pane">
      <div class="tabbar">
        <!-- In pipeline order: Markdown is what Jinja produced, TeX what pandoc made of it,
             PDF what xelatex made of that. PDF stays the tab that opens, being the finished
             thing, but it now sits at the end of the chain it comes from. -->
        <button class="tab" data-output="rendered" data-tier="markdown">Rendered Markdown</button>
        <button class="tab" data-output="tex" data-tier="tex">TeX</button>
        <button class="tab" data-output="html" data-tier="markdown">HTML</button>
        <button class="tab active" data-output="pdf" data-tier="pdf">PDF</button>
        <button class="tab" data-output="lint" data-tier="markdown">Lint (advisory)</button>
        <button class="tab" data-output="log">Log</button>
        <a id="pdf-newtab" class="tab-link" href="#" target="_blank" rel="noopener">open in tab &#8599;</a>
      </div>
      <div id="output-pdf" class="output-frame">
        <!-- Drawn by pdf.js (static/pdfview.js), so the editor keeps the zoom and the scroll
             position across a recompile or a change of language. -->
        <div id="pdf-view" role="document" aria-label="Compiled problem"></div>
        <div id="pdf-zoom" class="pdf-zoom" hidden>
          <button id="pdf-zoom-out" title="Zoom out (Ctrl+wheel)">&minus;</button>
          <span id="pdf-zoom-label"></span>
          <button id="pdf-zoom-in" title="Zoom in (Ctrl+wheel)">+</button>
          <button id="pdf-zoom-fit" title="Fit the width of the pane">fit</button>
        </div>
        <div id="pdf-placeholder" class="placeholder">Nothing compiled yet &mdash; press Ctrl/Cmd+Enter.</div>
      </div>
      <!-- The fragment the web gets, rendered rather than listed: a list or a table that pandoc
           writes differently for HTML shows up here and in no other tab. `allow-scripts` so
           MathJax can typeset it, and deliberately without `allow-same-origin`, which leaves the
           frame on an opaque origin with no way back into the editor. -->
      <div id="output-html" class="output-frame" hidden>
        <iframe id="html-view" sandbox="allow-scripts"
                title="HTML fragment, as the web gets it"></iframe>
      </div>
      <pre id="output-rendered" class="output" hidden><code id="output-rendered-code"></code></pre>
      <pre id="output-tex" class="output" hidden><code id="output-tex-code"></code></pre>
      <!-- Shown in place of a pane whose tier this machine cannot do. The tab stays clickable
           on purpose: a `disabled` button swallows the click, which leaves a tooltip as the only
           place to put three lines of install instructions. -->
      <div id="output-unavailable" class="output unavailable-panel" hidden></div>
      <div id="output-lint" class="output" hidden></div>
      <pre id="output-log" class="output" hidden><code id="output-log-code"></code></pre>
    </section>
    <!-- Shown instead of the grid when no module has a populated source/ tree. -->
    <div id="empty-source" class="empty-source" hidden></div>
  </main>

  <script src="/static/highlight.js?v={{ assets }}"></script>
  <script src="/static/app.js?v={{ assets }}"></script>
</body>
</html>
