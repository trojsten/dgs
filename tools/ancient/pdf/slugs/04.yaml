# Náboj 2001 -> volume 04. The key is the provisional id `draft.py` gave each problem, which is
# its printed number in the `Zadania` chapter; the value is the slug it took in the tree.
#
# Named from the *story* rather than the physics, which is the house habit and the reason for
# it: a corpus named after the physics fills up with `inclined-plane-3`, and twenty-eight years
# of Náboj have a great many inclined planes. Short, and checked for collisions against every
# other volume and `pool/` -- a slug has to be unique across the whole archive, because `pool`
# problems move between years.
