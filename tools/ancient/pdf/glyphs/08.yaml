# Glyph identifications for `08.pdf`, read off the contact sheets `sheet.py` produces.
#
# These fonts are subset with glyph names that are *indices*, not character codes. `cmmi`
# happens to run at code + 3, the same shift as the text fonts -- the Greek proves it, since
# G14/G15/G28/G29/G30 are exactly alpha/beta/pi/rho/sigma. `cmr` does not: `=` is G39, `1` is
# G129 and `0` is G102, and its G123 is a Delta, which OT1 has no room for. That font is a
# *merged* subset, which is why no shift describes it and why the sheet is the only authority.
#
# Keyed by font family rather than by size: cmr8 and cmr12 agree glyph for glyph in this
# booklet, as do cmmi6, cmmi8 and cmmi12, so one table serves all sizes. Anything absent is
# reported by `draft.py`, never guessed.
