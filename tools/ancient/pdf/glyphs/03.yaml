# Glyph identifications for `03.pdf`, read off the contact sheet `sheet.py` produces.
#
# `cmmi` is declared trusted rather than read: its Greek sits exactly three above its own code
# points -- alpha at G14, lambda at G24, mu at G25, pi at G28, tau at G31, varepsilon at G37 --
# which the sheet confirms rather than establishes. `cmr` is a merged subset and scrambled
# (`=` at G39, `x` at G32, and a `Delta` at G123 that OT1 has no room for), so it is read.
trust: [cmmi]
cmr:
  12: '3'
  16: 'i'
  25: 'C'
  28: ')'
  32: 'x'
  33: 'k'
  39: '='
  46: '7'
  50: '2'
  52: 'm'
  63: 'n'
  64: 'a'
  68: '5'
  69: '('
  71: ':'
  72: '8'
  76: 'o'
  83: '6'
  85: 'c'
  86: 'V'
  96: 'W'
  97: 'J'
  98: '9'
  101: '4'
  102: '0'
  104: 'r'
  108: '\Omega'
  110: '+'
  116: 's'
  123: '\Delta'
  124: 't'
  125: 'g'
  129: '1'
cmsy:
  3: '-'
  28: '\approx'
  30: '\prime'
  31: '\circ'
  36: '\rightarrow'
  44: '\Rightarrow'
  51: '-'
  52: '\infty'
  109: '|'
  115: '\sqrt'
  # `G115` (and `G73`, the same character in the 8pt subset) is the **radical sign**, not a
  # solidus. Read off the sheet it is a thin diagonal stroke and was written down as `/`;
  # `metrics.py` matches its width to `cmsy`'s `\surd`, and a crop with its formula around it
  # settles it -- `06.pdf` sets $\sqrt{2}$ there, and printed `/2`.
  # `G30` is the **prime**, which every one of these tables had left out as unreadable.

# **AMS symbols have no standard table in `encodings.py`, so they live here.** `decode(code,
# 'ams')` returns nothing for every code, which meant every `msam`/`msbm` glyph in the archive
# was dropped without a word -- forty placements across six booklets, each one a relation or an
# angle vanishing out of the middle of a formula. The numbering is the usual code plus three,
# confirmed five times over against `amssymb.sty`: `G57`/`G65` are its `"36`/`"3E`
# (`\leqslant`, `\geqslant`) and `G95`/`G96`/`G97` its `"5C`/`"5D`/`"5E` (`\angle`,
# `\measuredangle`, `\sphericalangle`). `msbm` is not: its `G121` is `"7B`, `\varkappa`, which
# the width admits and the sheet shows.
msam:
  57: '\leqslant'
  65: '\geqslant'
