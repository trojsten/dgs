# Glyph identifications for `05.pdf`. Both `cmr` and `cmmi` are read here -- see the note on `cmmi` below for why trusting it was wrong.
#
# The `cmr` numbering here is the same scramble as `03` and `04`, glyph for glyph, which the
# sheet *confirms* rather than assumes: 05 was read cold and every number it shares with those
# two agrees. That is worth more than the table itself, because it says the merged subset is a
# property of the toolchain these authors ran, not of a single booklet -- and the sheet catches
# it if a year ever departs from it.
#
# This volume is imposed two-up, so it carries three sizes of `cmr` (1204, 8030, 6022) and two
# of `cmsy`. `_family` keys them together, and the sizes agree with one another throughout.
cmr:
  7: '\doteq'
  12: '3'
  16: 'i'
  28: ')'
  32: 'x'
  39: '='
  46: '7'
  50: '2'
  52: 'm'
  63: 'n'
  64: 'a'
  68: '5'
  69: '('
  72: '8'
  76: 'o'
  83: '6'
  85: 'c'
  98: '9'
  101: '4'
  102: '0'
  104: 'r'
  108: '\Omega'
  110: '+'
  116: 's'
  123: '\Delta'
  124: 't'
  125: 'g'
  129: '1'
cmsy:
  3: '-'
  4: '\cdot'
  9: '\pm'
  23: '\leq'
  24: '\geq'
  30: '\prime'
  31: '\circ'
  32: '\gg'
  36: '\rightarrow'
  44: '\Rightarrow'
  51: '-'
  52: '\infty'
  53: '\in'
  # **`G53` is `\in` here and `\notin` in `08`, and that is the reason these tables stay
  # per volume.** The `cmr` numbering agrees across every booklet from `02` to `08` -- 24 to 29
  # entries shared per pair, not one disagreement -- and `cmmi`'s scramble is shared by `02`,
  # `04`, `05` and `06`, so it is tempting to merge `cmsy` the same way. Twenty-two of its
  # twenty-three entries would survive that merge intact and the twenty-third would hand `08`'s
  # slashed glyph to this booklet's unslashed one, silently, in the single formula that uses it.
  # `metrics.py` catches it -- the width admits `\in` and refuses `\notin` -- and a crop settles
  # it, but only because the merge was checked against each volume's own font rather than
  # against the other volumes' readings.
  57: '\neq'
  66: '\perp'
  73: '\sqrt'
  109: '|'
  115: '\sqrt'
  # `G115` (and `G73`, the same character in the 8pt subset) is the **radical sign**, not a
  # solidus. Read off the sheet it is a thin diagonal stroke and was written down as `/`;
  # `metrics.py` matches its width to `cmsy`'s `\surd`, and a crop with its formula around it
  # settles it -- `06.pdf` sets $\sqrt{2}$ there, and printed `/2`.
  # `G30` is the **prime**, which every one of these tables had left out as unreadable.

# **`cmmi` is read, not trusted, and that is the correction this table exists for.** It used to
# carry `trust: [cmmi]`, on the strength of `03`, `07` and `08`, whose `cmmi` really is the
# character code plus three. This year's is not: matched against `cmmi12.tfm` its glyph numbers
# agree with code+3 on *nothing* and contradict it outright nine times. Every maths italic in
# the volume was therefore a different letter -- a speed `v` printed as `\beta`, a radius `R`
# as `\rightharpoonup`, a height `h` as `\Theta` -- with no marker, because the decode was
# confident.
#
# The numbering is the same scramble `02` carries, glyph for glyph, and the same in all three
# sizes here, so one family key serves. It was read off a contact sheet and then checked
# against the widths in `02`, `04`, `05` and `06`: every entry a width can decide is confirmed
# by the metric, and none is contradicted, in all four.
#
# The nine entries beyond `02`'s original reading -- `\gamma`, `.`, `w`, `z`, `\delta`, `o`,
# `e`, `X`, `Z` -- are the glyphs `02` itself never sets. They were read the same way, off a
# second sheet, once removing the false trust had turned them from wrong letters into 328
# marked holes across `04`, `05` and `06`.
cmmi:
  4: 'u'
  5: 'h'
  7: 'N'
  8: 'A'
  9: '<'
  11: '\varrho'
  14: '\gamma'
  15: 'v'
  16: 'i'
  17: 'O'
  18: 'B'
  23: '.'
