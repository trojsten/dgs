# Glyph identifications for `05.pdf`. `cmmi` is trusted rather than read -- see `03.yaml`.
#
# The `cmr` numbering here is the same scramble as `03` and `04`, glyph for glyph, which the
# sheet *confirms* rather than assumes: 05 was read cold and every number it shares with those
# two agrees. That is worth more than the table itself, because it says the merged subset is a
# property of the toolchain these authors ran, not of a single booklet -- and the sheet catches
# it if a year ever departs from it.
#
# This volume is imposed two-up, so it carries three sizes of `cmr` (1204, 8030, 6022) and two
# of `cmsy`. `_family` keys them together, and the sizes agree with one another throughout.
trust: [cmmi]
cmr:
  7: '\doteq'
  12: '3'
  16: 'i'
  28: ')'
  32: 'x'
  39: '='
  46: '7'
  50: '2'
  52: 'm'
  63: 'n'
  64: 'a'
  68: '5'
  69: '('
  72: '8'
  76: 'o'
  83: '6'
  85: 'c'
  98: '9'
  101: '4'
  102: '0'
  104: 'r'
  108: '\Omega'
  110: '+'
  116: 's'
  123: '\Delta'
  124: 't'
  125: 'g'
  129: '1'
cmsy:
  3: '-'
  4: '\cdot'
  9: '\pm'
  23: '\leq'
  24: '\geq'
  30: '\prime'
  31: '\circ'
  32: '\gg'
  36: '\rightarrow'
  44: '\Rightarrow'
  51: '-'
  52: '\infty'
  53: '\in'
  66: '\perp'
  109: '|'
  115: '\sqrt'
  # `G115` (and `G73`, the same character in the 8pt subset) is the **radical sign**, not a
  # solidus. Read off the sheet it is a thin diagonal stroke and was written down as `/`;
  # `metrics.py` matches its width to `cmsy`'s `\surd`, and a crop with its formula around it
  # settles it -- `06.pdf` sets $\sqrt{2}$ there, and printed `/2`.
  # `G30` is the **prime**, which every one of these tables had left out as unreadable.
