  44: 'l'
  45: 'R'
  46: 'E'
  47: '\omega'
  48: '\varepsilon'
  52: '\rho'
  53: 'z'
  54: 'm'
  55: 'S'
  56: 'F'
  58: '>'
  62: '\mu'
  63: 'n'
  64: 'a'
  65: 'T'
  66: '\delta'
  67: 'G'
  74: 'o'
  75: 'b'
  76: 'U'
  77: 'H'
  79: '\vec'
  82: 'p'
