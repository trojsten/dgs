# Glyph identifications for `06.pdf`. Both `cmr` and `cmmi` are read here -- see the note on `cmmi` below for why trusting it was wrong.
#
# This year puts accented letters in `cmr`, which the others do not, and its G14 does not look
# like the same character at 12pt as at 8pt -- `š` against `č`. Since a family is keyed once
# for all its sizes here, G14 is left out and reported rather than settled by eye from two
# contaminated crops.
cmr:
  12: '3'
  # The caron on its own -- the base letter is set before it and the two compose, so
  # this is a combining U+030C and not a precomposed š: the word is `konšt.`, spelled
  # `k o n s <G14> t`, and reading it as š gave `kon sš t.`
  14: "̌"
  16: 'i'
  28: ')'
  39: '='
  46: '7'
  50: '2'
  63: 'n'
  64: 'a'
  68: '5'
  69: '('
  71: ':'
  72: '8'
  76: 'o'
  83: '6'
  85: 'c'
  98: '9'
  101: '4'
  102: '0'
  104: 'r'
  110: '+'
  116: 's'
  123: '\Delta'
  124: 't'
  125: 'g'
  129: '1'
cmsy:
  3: '-'
  5: '\times'
  30: '\prime'
  31: '\circ'
  36: '\rightarrow'
  44: '\Rightarrow'
  51: '-'
  73: '\sqrt'
  102: '\times'
  107: '\langle'
  108: '\rangle'
  109: '|'
  115: '\sqrt'
  # `G115` (and `G73`, the same character in the 8pt subset) is the **radical sign**, not a
  # solidus. Read off the sheet it is a thin diagonal stroke and was written down as `/`;
  # `metrics.py` matches its width to `cmsy`'s `\surd`, and a crop with its formula around it
  # settles it -- `06.pdf` sets $\sqrt{2}$ there, and printed `/2`.
  # `G30` is the **prime**, which every one of these tables had left out as unreadable.

# **`cmmi` is read, not trusted, and that is the correction this table exists for.** It used to
# carry `trust: [cmmi]`, on the strength of `03`, `07` and `08`, whose `cmmi` really is the
# character code plus three. This year's is not: matched against `cmmi12.tfm` its glyph numbers
# agree with code+3 on *nothing* and contradict it outright nine times. Every maths italic in
# the volume was therefore a different letter -- a speed `v` printed as `\beta`, a radius `R`
# as `\rightharpoonup`, a height `h` as `\Theta` -- with no marker, because the decode was
# confident.
#
# The numbering is the same scramble `02` carries, glyph for glyph, and the same in all three
# sizes here, so one family key serves. It was read off a contact sheet and then checked
# against the widths in `02`, `04`, `05` and `06`: every entry a width can decide is confirmed
# by the metric, and none is contradicted, in all four.
#
# The nine entries beyond `02`'s original reading -- `\gamma`, `.`, `w`, `z`, `\delta`, `o`,
# `e`, `X`, `Z` -- are the glyphs `02` itself never sets. They were read the same way, off a
# second sheet, once removing the false trust had turned them from wrong letters into 328
# marked holes across `04`, `05` and `06`.
cmmi:
  4: 'u'
  5: 'h'
  7: 'N'
  8: 'A'
  9: '<'
  11: '\varrho'
  14: '\gamma'
  15: 'v'
