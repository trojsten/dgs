cmsy80308:
  30: '\prime'
  31: '\circ'

# The three plain cuts are trusted and decode by OT1 without a table -- except for the one
# glyph the encoding cannot reach. `G46._` is the merge's second copy of `+`, and mupdf's
# suffix put it outside `G<n>`, so all 89 of them were dropped in silence. A stem key with a
# single entry is enough: every other glyph still falls through to the trusted decode.
cmr100385:
  -46: '+'
cmr70269:
  -46: '+'

# **The 258 glyphs this booklet still drops are all figure labels and none is prose.** Its
# second document's drawings were made in a Windows program and carry their text in Courier,
# Times, Avant Garde and Symbol as TrueType subsets with no usable `unicode`, so `3\Omega`,
# `7,5 cm`, `d=2R` and the rest decode to nothing. Page 9 is the one to look at. Every drawing
# in the volume is being redrawn, so the labels are transcribed off the page with the picture
# rather than off the text layer, and a table for four proprietary fonts would be read once
# and then thrown away with them.

