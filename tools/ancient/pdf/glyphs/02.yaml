# Glyph identifications for `02.pdf`.
#
# **This booklet is two documents merged, and they are subset differently.** Every other year
# here has one numbering per family, which is why `_family` drops the size; `02.pdf` has two,
# and they disagree -- `G4` is `h` in one `cmr` and `\Delta` in the other, `G51` is `(` in one
# and `0` in the other. So this table is keyed by **font stem** rather than by family, which
# `glyphs.read_page` looks up first.
#
# The split runs by design size, not by scale: the 10, 7 and 5 point cuts of `cmr`, `cmmi`
# and `cmsy` are **plain OT1 shifted by three** and need no table at all -- they are
# declared trusted below, and the sheet confirms them glyph for glyph, `G14` alpha through
# `G90` W. The 12, 8 and 6 point cuts are the merged scramble that 03, 04 and 05 also carry,
# and are listed.
#
# The scrambled `cmr` agrees with `03.yaml` and `04.yaml` wherever the two overlap, which is
# the useful part: the scramble is a property of the toolchain these authors ran, not of one
# booklet. The scrambled `cmmi` is shared with `04`, `05` and `06`, and `metrics.py` -- matching each glyph's
# `/Widths` entry against `cmmi12.tfm` -- agrees with every character read off the contact
# sheet. Where the width was unique it decided outright; where two characters share a width
# the sheet chose between them, and the sheet's choice was inside the allowed set every time.
trust:
  - cmr100385
  - cmr70269
  - cmr50192
  - cmmi100385
  - cmmi70269
  - cmmi50192
  - cmsy100385
  - cmsy70269

# --- the 12/8/6 pt stream, subset as one scrambled merge ----------------------
