# Glyph identifications for `07.pdf`, read off the contact sheets `sheet.py` produces.
#
# `cmmi` is code + 3 throughout, and the Greek proves it independently: gamma at G16 (0x0D+3),
# delta at G17, mu at G25, tau at G31, pi at G28, sigma at G30. `cmr` is a merged subset and is
# scrambled -- `=` is G39 while `x` is G32 -- so it can only be read, not derived.
#
# The numbering agrees with `08.yaml` wherever the two booklets share a glyph, which is what
# one workflow over several years produces. It is still read per file rather than inherited:
# `glyphs.identified` binds a table to the md5 above, because the same G-number meaning a
# different character is exactly the silent corruption a table exists to prevent.
trust: [cmmi]
cmr:
  12: '3'
  16: 'i'
  32: 'x'
  39: '='
  46: '7'
  50: '2'
