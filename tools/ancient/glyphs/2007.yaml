# What 2007's outlined figure labels are.
#
# Every one of the year's 21 figures is a CorelDRAW 11 EPS whose Type 1 subsets carry no
# ToUnicode map, so no tool can say what a glyph is and `_from_eps` reports the loss and ships
# outlines. `tools/ancient/outlines.py` puts the text back using this table, which was read
# once off a rendered sheet of all 92 distinct shapes.
#
# `shapes` is a fingerprint of the figure's own outlines, because a figure reaches the tree
# under the role it plays -- `problem.svg`, `solution-2.svg` -- and has lost the archive's name
# for it by then. Each glyph is `[character, style, size]`: `i` italic for a variable, `u`
# upright for a digit, a unit, an operator or a degree sign, and `-` to leave the outline
# alone, which is right for an accent (the arrow of a vector) and for a drawn point marker.
