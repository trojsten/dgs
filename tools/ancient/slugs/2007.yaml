# Náboj 2007 -> volume 10. The year has no `priklady.tex` list of `\priklad{}` includes: its
# `07priklady.tex` *is* the problems, one `\zadanie`/`\vzorak`/`\comment` group after another, so
# the key is the group's position in that file and the position is the printed number.
#
# **Only the 31 `\zadanie` problems are here.** `07priklady.tex` also holds six `\extra` groups,
# which `07naboj.pdf` and the answer sheet number 32+ to 37+ — but the tear-off sheets handed to
# the teams (`07strihacie.tex`) define `\extra` as empty, and the organisers' own report says
# "pre družstvá bolo pripravených 31 príkladov". They were a bonus sheet, not part of the round;
# `errors/10.md` records all six.
#
# Two names are not chosen here but kept: `support` (1) and `southeast` (25) were converted by
# hand years ago and are already in the tree. Checked against all 728 existing ids in phys; those
# two are the only collisions and are deliberate.
