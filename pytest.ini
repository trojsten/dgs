[pytest]
addopts = --ignore=source --ignore=build --ignore=output --ignore=install

# The repository root, so that `import core` works from a test wherever it sits. `core/tests/`
# got that for free -- it is one level under a directory that was already importable -- and
# `modules/<module>/tests/` does not, which is where the tests that need a content repository
# checked out now live.
pythonpath = .
