# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Install DeGeŠ

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@master
    - name: astral-sh/setup-uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: uv sync --dev
    - name: "Install utilities"
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: librsvg2-bin lcdf-typetools
        version: 1.0
    # pandoc and pandoc-crossref have to match: the filter is compiled against one pandoc and
    # warns that anything else "is not supported, strange things may (and likely will) happen
    # silently". So pin only the filter, ask the binary which pandoc it was built with, install
    # exactly that one, and fail the job if the pair still disagrees. Bumping = one version here.
    - name: "Set up pandoc and pandoc-crossref"
      env:
        PANDOC_CROSSREF_VERSION: v0.3.25
      run: |
        set -euo pipefail
        curl -fsSL "https://github.com/lierdakil/pandoc-crossref/releases/download/${PANDOC_CROSSREF_VERSION}/pandoc-crossref-Linux-X64.tar.xz" | tar -xJ
        install -m755 pandoc-crossref /usr/local/bin/pandoc-crossref
        PANDOC_VERSION="$(pandoc-crossref --version | sed -n 's/.*built with Pandoc v\([0-9][0-9.]*\).*/\1/p')"
        echo "pandoc-crossref ${PANDOC_CROSSREF_VERSION} was built with pandoc ${PANDOC_VERSION}"
        curl -fsSLO "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
        sudo dpkg -i "pandoc-${PANDOC_VERSION}-1-amd64.deb"
        printf 'x [-@eq:d]\n\n$$E=mc^2$$ {#eq:d}\n' > /tmp/crossref-check.md
        pandoc --filter pandoc-crossref --to latex /tmp/crossref-check.md 2>&1 | tee /tmp/crossref-check.out
        ! grep -q 'WARNING' /tmp/crossref-check.out
        grep -q 'ref{eq:d}' /tmp/crossref-check.out
    - name: "Clone FontPro"
      uses: actions/checkout@master
      with:
        repository: sebschub/FontPro
        path: assets/fonts/FontPro
    - name: "Set up FontPro"
      run: |
        cd assets/fonts/FontPro
        mkdir otf
        cp ../../fonts/MinionPro/*.otf otf/
        ./scripts/makeall MinionPro
        yes | sudo ./scripts/install
        yes | sudo updmap-sys --enable Map=MinionPro.map
    - name: "Install XeLaTeX"
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: texlive-full texlive-fonts-extra texlive-science
        version: 1.0
    - name: "Set up XeLaTeX"
      run: |
        DIR=$(dirname $0)
        TEXHOME=`kpsewhich -var-value=TEXMFHOME`
        mkdir -p $TEXHOME/tex/latex/
        ln -s $PWD/core/latex/dgs.cls $TEXHOME/tex/latex/dgs.cls
    - name: Test with pytest
      run: |
        uv run python -m pytest -s -v
    - name: "Clone testing repository"
      uses: actions/checkout@master
      with:
        repository: TrojstenSK/dgs-seminar-testing
        path: source/seminar/testing
    - name: "Build testing/01/1/1"
      run: |
        pwd
        # pipenv run make output/seminar/test/01/1/1
